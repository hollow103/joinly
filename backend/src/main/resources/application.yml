spring:
  application:
    name: joinly-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/joinly}
    username: ${DB_USERNAME:joinly}
    password: ${DB_PASSWORD:joinly_local}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_ISSUER:https://ulxrjlmpzaeouqbjbnjc.supabase.co/auth/v1}
          jwk-set-uri: ${SUPABASE_JWK_SET_URI:https://ulxrjlmpzaeouqbjbnjc.supabase.co/auth/v1/.well-known/jwks.json}

joinly:
  agreements:
    guidelines-version: ${JOINLY_GUIDELINES_VERSION:v1}
    privacy-version: ${JOINLY_PRIVACY_VERSION:v1}
    terms-version: ${JOINLY_TERMS_VERSION:v1}
  security:
    audience: ${SUPABASE_AUDIENCE:authenticated}
    api-key: ${SUPABASE_API_KEY:sb_publishable_TEBaRu7TbvpJ075XD-B_kA_3m_aosAd}
    connect-timeout: ${SUPABASE_CONNECT_TIMEOUT:2s}
    read-timeout: ${SUPABASE_READ_TIMEOUT:3s}
    user-info-uri: ${SUPABASE_USER_INFO_URI:https://ulxrjlmpzaeouqbjbnjc.supabase.co/auth/v1/user}
  notifications:
    dispatch-cron: ${JOINLY_NOTIFICATIONS_DISPATCH_CRON:0 * * * * *}
    dispatch-enabled: ${JOINLY_NOTIFICATIONS_DISPATCH_ENABLED:true}
    batch-size: ${JOINLY_NOTIFICATIONS_BATCH_SIZE:50}
    expo-endpoint: ${JOINLY_EXPO_ENDPOINT:https://exp.host/--/api/v2/push/send}
    expo-access-token: ${JOINLY_EXPO_ACCESS_TOKEN:}
    expo-connect-timeout: ${JOINLY_EXPO_CONNECT_TIMEOUT:2s}
    expo-read-timeout: ${JOINLY_EXPO_READ_TIMEOUT:5s}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

server:
  port: ${PORT:8080}
  error:
    include-message: never

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    url: /openapi.yaml
