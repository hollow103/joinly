<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="420" viewBox="0 0 1160 420" fill="none">
  <!-- Propuesta 4 — "Barrido": una pantalla de planes a tu alrededor. Barrido de
       radar + blips. Pensada como icono primero; el símbolo también vive suelto. -->
  <defs>
    <symbol id="p4-tile" viewBox="0 0 200 200">
      <rect x="4" y="4" width="192" height="192" rx="44" fill="#3157C9"/>
      <path d="M100 100 L18 100 A82 82 0 0 1 100 18 Z" fill="#FFFFFF" fill-opacity=".18"/>
      <circle cx="100" cy="100" r="82" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity=".3"/>
      <path d="M100 100 L100 18" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <circle cx="136" cy="60" r="9" fill="#FFFFFF"/>
      <circle cx="62" cy="142" r="9" fill="#FF9E3D"/>
      <circle cx="100" cy="100" r="7" fill="#FFFFFF"/>
    </symbol>
    <symbol id="p4-mark" viewBox="0 0 200 200">
      <path d="M100 100 L18 100 A82 82 0 0 1 100 18 Z" fill="#EAF0FF"/>
      <circle cx="100" cy="100" r="82" fill="none" stroke="#3157C9" stroke-width="4" stroke-opacity=".35"/>
      <path d="M100 100 L100 18" stroke="#3157C9" stroke-width="8" stroke-linecap="round"/>
      <circle cx="136" cy="60" r="10" fill="#3157C9"/>
      <circle cx="62" cy="142" r="10" fill="#FF9E3D"/>
      <circle cx="100" cy="100" r="8" fill="#101D40"/>
    </symbol>
  </defs>

  <rect width="1160" height="420" fill="#F5F7FC"/>

  <use href="#p4-tile" x="60" y="70" width="200" height="200"/>
  <text x="160" y="312" text-anchor="middle" fill="#65708F" font-family="Arial, sans-serif" font-size="15" font-weight="700">Icono de app</text>

  <use href="#p4-mark" x="360" y="86" width="176" height="176"/>
  <text x="448" y="312" text-anchor="middle" fill="#65708F" font-family="Arial, sans-serif" font-size="15" font-weight="700">Símbolo</text>

  <use href="#p4-tile" x="606" y="98" width="148" height="148"/>
  <text x="770" y="200" fill="#101D40" font-family="Helvetica Neue, Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-3">joinly</text>
  <text x="606" y="312" fill="#65708F" font-family="Arial, sans-serif" font-size="15" font-weight="700">Lockup horizontal</text>
</svg>
