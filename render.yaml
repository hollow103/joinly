# Render Blueprint para el backend de Joinly (piloto, plan Free).
# Deploy: Render → New → Blueprint → seleccionar este repo y la rama
# feature/mvp-integration (es la única con el backend implementado; main solo tiene specs).
# Render pedirá los valores de las variables marcadas con `sync: false` al crear el servicio.
services:
  - type: web
    name: joinly-backend
    runtime: docker
    plan: free
    region: frankfurt
    branch: feature/mvp-integration
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    # Solo redespliega cuando cambia algo que afecta a la imagen del backend.
    # Un cambio en mobile/, admin/ o docs/ no gasta un build.
    buildFilter:
      paths:
        - backend/**
        - openapi.yaml
        - render.yaml
    envVars:
      # --- Ajuste para 512 MB de RAM del plan Free ---
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:+ExitOnOutOfMemoryError"
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SERVER_TOMCAT_THREADS_MAX
        value: "30"
      # --- Constantes de la aplicación ---
      - key: JOINLY_TERMS_VERSION
        value: v1
      - key: JOINLY_PRIVACY_VERSION
        value: v1
      - key: JOINLY_GUIDELINES_VERSION
        value: v1
      # --- Supabase (proyecto ulxrjlmpzaeouqbjbnjc). URLs y publishable key son
      #     públicas y ya viven en application.yml / la app móvil ---
      - key: SUPABASE_AUDIENCE
        value: authenticated
      - key: SUPABASE_ISSUER
        value: https://ulxrjlmpzaeouqbjbnjc.supabase.co/auth/v1
      - key: SUPABASE_JWK_SET_URI
        value: https://ulxrjlmpzaeouqbjbnjc.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_USER_INFO_URI
        value: https://ulxrjlmpzaeouqbjbnjc.supabase.co/auth/v1/user
      - key: SUPABASE_API_KEY
        value: sb_publishable_TEBaRu7TbvpJ075XD-B_kA_3m_aosAd
      # --- Base de datos: se rellenan en el dashboard de Render al desplegar.
      #     Usar el SESSION POOLER de Supabase (IPv4, puerto 5432), NO la conexión
      #     directa db.<ref>.supabase.co (solo IPv6, no llega desde Render Free). ---
      # DB_URL: jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_URL
        sync: false
      # DB_USERNAME: postgres.ulxrjlmpzaeouqbjbnjc
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
